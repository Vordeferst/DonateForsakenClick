<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forsaken Click Donate</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background: #0f0f14;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 40px;
    text-align: center;
    color: #fff;
  }

  .product {
    width: 100%;
    max-width: 700px;
  }

  .product img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
    background: #1a1a22;
  }

  .product .name {
    margin-top: 20px;
    font-size: 1.5rem;
    font-weight: bold;
    text-align: left;
  }

  .product .price {
    margin-top: 8px;
    font-size: 1.2rem;
    color: #aaa;
    text-align: left;
  }

  .buy {
    display: inline-block;
    margin-top: 24px;
    padding: 14px 40px;
    background: #ff00cc;
    color: #fff;
    font-size: 1rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 8px;
    transition: background 0.2s ease;
  }

  .buy:hover {
    background: #cc00a3;
  }
</style>
</head>
<body>

  <h1>Forsaken Click Donate</h1>

  <div class="product">
    <img src="Pass.png" alt="Pass Season 1">
    <div class="name">Pass Season 1</div>
    <div class="price">Цена: 99₽</div>
    <a href="https://t.me/ForsakenDonate" target="_blank" rel="noopener noreferrer" class="buy">Купить</a>
  </div>

</body>
</html>
